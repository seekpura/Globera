name: Bootstrap T01 2.8 source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.head_ref == 't01-react-2.8-bootstrap' || github.ref_name == 't01-react-2.8-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t01-react-2.8-bootstrap
          fetch-depth: 0

      - name: Expand T01 React 2.8 source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap-2.8.yml /tmp/bootstrap-2.8.yml
          mkdir -p /tmp/t01
          cat bootstrap/part-*.b64 | base64 -d > /tmp/t01/source.tar.xz
          tar -xJf /tmp/t01/source.tar.xz -C /tmp/t01
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/t01/T01_TikTok_React_2.8/. .
          mkdir -p .github/workflows
          cp /tmp/bootstrap-2.8.yml .github/workflows/bootstrap-2.8.yml

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-data.mjs || true
          node scripts/validate-ui.mjs || true

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expand T01 TikTok React 2.8 source" || exit 0
          git push origin HEAD:t01-react-2.8-bootstrap

# synchronize PR after trusted base trigger
