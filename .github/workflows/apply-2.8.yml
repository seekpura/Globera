name: Apply and Validate T01 React 2.8

on:
  push:
    branches: ['t01-react-2.8']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-t01-2.8
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[source-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble source
        shell: bash
        run: |
          cat .source/part_* > /tmp/t01-source.b64
          base64 -d /tmp/t01-source.b64 > /tmp/t01-source.tar.xz
          rm -rf /tmp/t01-source
          mkdir -p /tmp/t01-source
          tar -xJf /tmp/t01-source.tar.xz -C /tmp/t01-source
          rsync -a --delete --exclude '.git/' --exclude 'LICENSE' /tmp/t01-source/app/ ./
          sed -i 's/pnpm@10\.9\.2/pnpm@10.34.6/g' package.json
          sed -i 's/version: 10\.9\.2/version: 10.34.6/g' .github/workflows/validate.yml

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Validate static data/contracts
        run: pnpm validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: T01 React 2.8 connected operating dataflow [source-applied]"
          git push origin HEAD:t01-react-2.8
