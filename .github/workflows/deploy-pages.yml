name: Validate and Build T01

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate 12 modules / 48 lessons
        run: npm run validate
      - name: TypeScript and Vite build
        run: npm run build
      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: globera-t01-dist
          path: dist
